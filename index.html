<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <script>
      try {
        if (localStorage.getItem("muvbyyy-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#050605";
        }
      } catch (error) {
        console.warn("Could not read the saved theme:", error);
      }
    </script>
    <style>
      html, body { margin: 0; background: #f7f8f2; color: #20251b; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #050605; color: #f5f5f0; }
      .initial-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .initial-loader span { width: 9px; height: 9px; border-radius: 50%; background: #81ac22; animation: initial-pulse 1s ease-in-out infinite alternate; }
      .initial-loader span:nth-child(2) { animation-delay: .15s; }
      .initial-loader span:nth-child(3) { animation-delay: .3s; }
      @keyframes initial-pulse { to { opacity: .3; transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .initial-loader span { animation: none; } }
    </style>
    <meta
      name="description"
      content="Muvbyyy Coding Studio designs and builds distinctive, responsive websites for ambitious businesses."
    />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muvbyyy Coding Studio" />
    <meta property="og:title" content="Muvbyyy Coding Studio — Websites, thoughtfully made" />
    <meta property="og:description" content="Distinctive, responsive websites designed and built for ambitious businesses." />
    <meta property="og:url" content="https://muvbyyy-company-ltd.vercel.app/" />
    <meta property="og:image" content="https://muvbyyy-company-ltd.vercel.app/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muvbyyy Coding Studio logo: a green M on a dark background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muvbyyy Coding Studio — Websites, thoughtfully made" />
    <meta name="twitter:description" content="Distinctive, responsive websites designed and built for ambitious businesses." />
    <meta name="twitter:image" content="https://muvbyyy-company-ltd.vercel.app/social-preview.png" />
    <meta name="twitter:image:alt" content="Muvbyyy Coding Studio logo: a green M on a dark background" />
    <title>Muvbyyy Coding Studio — Websites, thoughtfully made</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
